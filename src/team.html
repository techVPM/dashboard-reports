<div class="vpm tm" id="vpm">
<div class="wrap">
  <header class="tbar">
    <div class="brand">VIDEO POWER<span>MARKETING</span></div>
    <div class="tbtns"><a class="tlink" href="/admin">Edit clients and goals</a><button type="button" class="tlink" id="out" hidden>Sign out</button></div>
  </header>
  <div class="thead">
    <div><h1>All clients</h1><p class="sub" id="tsub">Last 30 days, checked against each client's goals.</p></div>
    <div class="seg" id="filt" role="group" aria-label="Filter clients" hidden></div>
  </div>
  <form class="panel gate" id="gate" hidden>
    <h2>Team sign in</h2>
    <p class="sub">Use the admin password (the ADMIN_PASSWORD setting in Netlify).</p>
    <div class="grow"><input type="password" id="pw" autocomplete="current-password" aria-label="Password" placeholder="Password"><button class="mbtn" type="submit">Sign in</button></div>
    <p class="err" id="gerr" hidden></p>
  </form>
  <section id="sum" class="sumrow"></section>
  <section id="list" class="clist"><div class="panel"><p class="msg">Loading</p></div></section>
</div>
</div>
<script>
(function () {
  'use strict';
  var KEY = 'vpm_admin_key', pw = '';
  try { pw = localStorage.getItem(KEY) || ''; } catch (e) { /* private mode */ }
  var $ = function (id) { return document.getElementById(id); };
  var DATA = null, FILT = 'all', OPEN = {};
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(v) { return v == null ? 'n/a' : '$' + Math.round(v).toLocaleString('en-US'); }
  function money2(v) { return v == null ? 'n/a' : '$' + (v >= 1000 ? Math.round(v).toLocaleString('en-US') : v.toFixed(2)); }
  function int(v) { return v == null ? 'n/a' : Math.round(v).toLocaleString('en-US'); }
  function fmt(v, u) { return u === 'money' ? money(v) : u === 'money2' ? money2(v) : u === 'x' ? (v == null ? 'n/a' : v.toFixed(2) + 'x') : int(v); }
  function chg(a, b) { if (!b) return ''; var p = Math.round((a - b) / b * 100); return (p > 0 ? '+' : '') + p + '%'; }
  var WORD = { good: 'On track', warn: 'Watch', bad: 'Off track', none: 'No goals or data' };
  var ORDER = { bad: 0, warn: 1, good: 2, none: 3 };

  function api(path, opt) {
    opt = opt || {}; opt.headers = Object.assign({ 'x-admin-key': pw }, opt.headers || {});
    return fetch(path, opt).then(function (r) { return r.json().then(function (j) { if (r.status === 401) throw { auth: 1 }; if (!r.ok) throw new Error(j.error || 'Failed'); return j; }); });
  }
  function gate(msg) {
    $('gate').hidden = false; $('list').innerHTML = ''; $('sum').innerHTML = ''; $('filt').hidden = true; $('out').hidden = true;
    if (msg) { $('gerr').hidden = false; $('gerr').textContent = msg; }
    $('pw').focus();
  }
  $('gate').addEventListener('submit', function (e) {
    e.preventDefault(); pw = $('pw').value.trim(); if (!pw) return;
    try { localStorage.setItem(KEY, pw); } catch (er) { /* ignore */ }
    load();
  });
  $('out').addEventListener('click', function () { try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } pw = ''; gate(); });

  function load() {
    if (!pw) return gate();
    $('list').innerHTML = '<div class="panel"><p class="msg">Loading every client</p></div>';
    api('/api/team').then(function (j) { DATA = j; $('gate').hidden = true; $('gerr').hidden = true; $('out').hidden = false; draw(); })
      .catch(function (e) { if (e && e.auth) gate('That password did not work.'); else $('list').innerHTML = '<div class="panel"><p class="msg">' + esc(e.message) + '</p></div>'; });
  }

  function bar(c) {
    if (c.actual == null || !c.goal) return '';
    var max = Math.max(c.actual, c.goal) * 1.15, w = Math.min(100, c.actual / max * 100), g = c.goal / max * 100;
    var lo = c.low ? '<i class="glo" style="left:' + (c.low / max * 100) + '%"></i>' : '';
    return '<div class="gbar"><div class="gfill ' + c.status + '" style="width:' + w + '%"></div>' + lo + '<i class="gmark" style="left:' + g + '%"></i></div>';
  }
  function check(c) {
    var goal = c.low ? fmt(c.low, c.unit) + ' to ' + fmt(c.goal, c.unit) : fmt(c.goal, c.unit);
    return '<div class="chk"><div class="cl">' + esc(c.label) + '</div><div class="cv"><b>' + fmt(c.actual, c.unit) + '</b><span>goal ' + goal + '</span><span class="pill ' + (c.status === 'none' ? 'early' : c.status) + '">' + (c.status === 'none' ? 'Too early' : WORD[c.status]) + '</span></div>' + bar(c) + '</div>';
  }
  function details(r) {
    var out = '';
    if (r.goal_note) out += '<p class="gnote">' + esc(r.goal_note) + '</p>';
    var bt = Object.keys(r.by_type || {});
    if (bt.length) out += '<h3>Spend by campaign type</h3><div class="chips">' + bt.map(function (k) { return '<span class="chip">' + esc(k) + ' <b>' + money(r.by_type[k]) + '</b></span>'; }).join('') + '</div>';
    if (r.actions && r.actions.length) {
      out += '<h3>Conversions</h3><div class="tw"><table class="t"><thead><tr><th><button>Conversion action</button></th><th class="n"><button>Last 30 days</button></th><th class="n"><button>Previous 30</button></th><th><button>Counted as</button></th></tr></thead><tbody>' +
        r.actions.map(function (a) { return '<tr><td class="nm"><b>' + esc(a.name) + '</b></td><td class="n">' + int(a.cur) + '</td><td class="n">' + int(a.prev) + '</td><td>' + (a.focus ? '<span class="pill good">Main result</span>' : a.watch ? '<span class="pill warn">Watching</span>' : '<span class="mut">Not counted</span>') + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    if (r.missing_conversions && r.missing_conversions.length) out += '<p class="warnline">No activity found for: ' + r.missing_conversions.map(esc).join(', ') + '. Check the spelling against Goals, Conversions in Google Ads, or it may simply have had none in 30 days.</p>';
    if (r.campaigns && r.campaigns.length) {
      out += '<h3>Campaigns</h3><div class="tw"><table class="t"><thead><tr><th><button>Campaign</button></th><th class="n"><button>Spend</button></th><th class="n"><button>' + esc(r.label) + '</button></th><th class="n"><button>Cost each</button></th></tr></thead><tbody>' +
        r.campaigns.map(function (c) { return '<tr><td class="nm"><b>' + esc(c.name) + '</b><br><span class="tag">' + esc(c.type) + '</span></td><td class="n">' + money(c.spend) + '</td><td class="n">' + int(c.res) + '</td><td class="n">' + money2(c.cpa) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    return '<div class="det">' + out + '</div>';
  }
  function card(r) {
    var links = '<a class="mbtn" href="' + esc(r.report_url) + '" target="_blank" rel="noopener">Client report</a><a class="obtn" href="' + esc(r.ads_url) + '" target="_blank" rel="noopener">Google Ads</a><a class="obtn" href="/admin#' + esc(r.token) + '">Edit goals</a>';
    if (r.missing) {
      return '<article class="panel crow"><div class="ctop"><div><h2>' + esc(r.name) + '</h2><p class="sub">' + esc(r.customer_id) + ' · ' + esc(r.why) + '</p></div><span class="pill early">No data yet</span></div><div class="cbtns"><button type="button" class="mbtn" data-load="' + esc(r.token) + '">Load now</button>' + links + '</div></article>';
    }
    var upd = r.updated ? new Date(r.updated).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
    var head = '<div class="ctop"><div><h2>' + esc(r.name) + '</h2><p class="sub">' + esc(r.customer_id) + (upd ? ' · updated ' + esc(upd) : '') + '</p></div><span class="pill big ' + (r.overall === 'none' ? 'early' : r.overall) + '">' + WORD[r.overall] + '</span></div>';
    var nums = '<div class="nums"><div><span>Spend</span><b>' + money(r.spend) + '</b><em>' + chg(r.spend, r.prev.spend) + '</em></div><div><span>' + esc(r.label) + '</span><b>' + int(r.results) + '</b><em>' + chg(r.results, r.prev.results) + '</em></div><div><span>Cost each</span><b>' + money2(r.cpa) + '</b><em>' + (r.cpa && r.prev.cpa ? chg(r.cpa, r.prev.cpa) : '') + '</em></div></div>';
    var checks = r.checks.length ? '<div class="checks">' + r.checks.map(check).join('') + '</div>' : '<p class="msg small">No goals yet. <a href="/admin#' + esc(r.token) + '">Add goals</a> to see how this client lines up.</p>';
    var open = !!OPEN[r.token];
    return '<article class="panel crow">' + head + nums + checks + '<div class="cbtns">' + links + '<button type="button" class="obtn" data-open="' + esc(r.token) + '" aria-expanded="' + open + '">' + (open ? 'Hide details' : 'Details') + '</button></div>' + (open ? details(r) : '') + '</article>';
  }
  function draw() {
    var rows = DATA.clients.slice().sort(function (a, b) { return ORDER[a.overall] - ORDER[b.overall] || (b.spend || 0) - (a.spend || 0); });
    var n = { good: 0, warn: 0, bad: 0, none: 0 }, spend = 0;
    rows.forEach(function (r) { n[r.overall]++; spend += r.spend || 0; });
    $('sum').innerHTML = '<div class="kpi"><div class="l">Spend, last 30 days</div><div class="v">' + money(spend) + '</div></div>' +
      ['bad', 'warn', 'good', 'none'].map(function (k) { return '<button type="button" class="kpi sk ' + k + (FILT === k ? ' on' : '') + '" data-f="' + k + '"><div class="l">' + WORD[k] + '</div><div class="v">' + n[k] + '</div></button>'; }).join('');
    var f = $('filt'); f.hidden = false;
    f.innerHTML = [['all', 'All'], ['bad', 'Off track'], ['warn', 'Watch'], ['good', 'On track']].map(function (o) { return '<button type="button" data-f="' + o[0] + '" class="' + (FILT === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('');
    var show = rows.filter(function (r) { return FILT === 'all' || r.overall === FILT; });
    $('list').innerHTML = show.length ? show.map(card).join('') : '<div class="panel"><p class="msg">No clients in this group.</p></div>';
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-f],[data-open],[data-load]'); if (!t) return;
    if (t.dataset.f) { FILT = FILT === t.dataset.f ? 'all' : t.dataset.f; return draw(); }
    if (t.dataset.open) { OPEN[t.dataset.open] = !OPEN[t.dataset.open]; return draw(); }
    if (t.dataset.load) {
      t.disabled = true; t.textContent = 'Loading, up to a minute';
      fetch('/api/report?k=' + encodeURIComponent(t.dataset.load) + '&days=30').then(function () { load(); }, function () { load(); });
    }
  });
  load();
})();
</script>

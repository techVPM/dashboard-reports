<div class="vpm" id="vpm">
<div class="app">
  <aside class="side" id="side">
    <div class="brand">VIDEO POWER<span>MARKETING</span></div>
    <button type="button" class="burger" id="burger" data-burger="1" aria-label="Menu" aria-expanded="false" aria-controls="nav"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="b1" d="M3 5h14"/><path class="b2" d="M3 10h14"/><path class="b3" d="M3 15h14"/></svg><span>Menu</span></button>
    <nav class="nav" id="nav" aria-label="Report sections"></nav>
    <div class="sidefoot" id="sidefoot">Google Ads performance report</div>
  </aside>
  <main>
    <div class="sample" id="sample" hidden>Sample data for layout review. These numbers are placeholders, not client results.</div>
    <div class="sample" id="stale" hidden>Showing the last saved numbers. Google Ads could not be reached just now, so these may be a little behind.</div>
    <header class="top">
      <div class="ttlblock"><h1 id="cli">Performance report</h1><h2 id="ttl"></h2><p id="sub"></p><p class="updm" id="updm"></p></div>
      <div class="datebox"><div class="seg" id="rangeseg" role="group" aria-label="Date range"></div><div class="rangebar" id="rangebar"></div></div>
    </header>
    <div class="toolbar" id="toolbar" role="toolbar" aria-label="Campaign filters">
      <div class="seg" id="mgrseg" role="group" aria-label="Who manages the campaigns" hidden></div>
      <div class="seg" id="typeseg" role="group" aria-label="Campaign type" hidden></div>
    </div>
    <div class="loader" id="loader" hidden role="status" aria-live="polite"><div class="lbar"><i id="lfill"></i></div><p><b id="lstat">Connecting to Google Ads</b><span id="lhint"></span></p></div>
    <section id="view" aria-live="polite"></section>
  </main>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="mbox">
    <div class="mhead"><div><h2 id="mtitle"></h2><p id="mmeta"></p></div><button type="button" class="mclose" data-close="1" aria-label="Close video">&times;</button></div>
    <div class="mvideo" id="mvideo"></div>
    <p class="mlink" id="mlink"></p>
  </div>
</div>
</div>

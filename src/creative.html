<div class="vpm tm cr" id="vpm">
<div class="wrap">
  <header class="tbar">
    <div class="brand">VIDEO POWER<span>MARKETING</span></div>
    <div class="tbtns"><!--TABS:creative--><button type="button" class="tlink" id="out" hidden>Sign out</button></div>
  </header>
  <div class="thead">
    <div><h1>Creative Hub</h1><p class="sub" id="tsub">Every video running for active clients, and how each one performs.</p></div>
    <div class="tctl crdates" id="tctl" hidden><div class="seg" id="rng" role="group" aria-label="Date range"></div>
      <form class="ccustom" id="cform" hidden><label>From <input type="date" id="cfrom" required></label><label>To <input type="date" id="cto" required></label><button class="mbtn" type="submit">Apply</button></form>
    </div>
  </div>
  <div class="cprog" id="cprog" hidden><div class="lbar"><i id="cfill"></i></div><p id="ctext"></p></div>
  <form class="panel gate" id="gate" hidden>
    <h2>Team sign in</h2>
    <p class="sub">Use the creative password (CREATIVE_PASSWORD in Netlify) or the admin password.</p>
    <div class="grow"><input type="password" id="pw" autocomplete="current-password" aria-label="Password" placeholder="Password"><button class="mbtn" type="submit">Sign in</button></div>
    <p class="err" id="gerr" hidden></p>
  </form>
  <section class="panel filters" id="filters" hidden>
    <div class="fld"><span>Campaigns</span><div class="seg" id="scp" role="group" aria-label="Which campaigns"></div></div>
    <label class="fld"><span>Client</span><select id="fclient"></select></label>
    <label class="fld"><span>Show</span><select id="fshow"><option value="all">All videos</option><option value="new">New this week</option><option value="running">Running now</option><option value="paused">Paused or stopped</option><option value="under">Underfunded winners</option></select></label>
    <label class="fld"><span>Search titles</span><input id="fq" type="search" placeholder="For example hook 2, testimonial, 9x16"></label>
    <label class="fld"><span>Minimum impressions</span><select id="fmin"><option value="0">Any, include small tests</option><option value="500" selected>500</option><option value="1000">1,000</option><option value="5000">5,000</option><option value="20000">20,000</option></select></label>
    <div class="fbtns2"><button type="button" class="obtn" id="csv">Download CSV</button></div>
  </section>
  <section id="sum" class="sumrow"></section>
  <section id="leaders" class="leaders"></section>
  <section id="list"><div class="panel"><p class="msg">Loading</p></div></section>
  <p class="sub" id="foot"></p>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="mbox"><div class="mhead"><div><h2 id="mtitle"></h2><p id="mmeta"></p></div><button type="button" class="mclose" data-close="1" aria-label="Close">&times;</button></div><div class="mvideo" id="mvideo"></div><div class="mcurve" id="mcurve"></div><p class="mlink" id="mlink"></p></div>
</div>
</div>
<script>
(function () {
  'use strict';
  var KEY = 'vpm_admin_key', pw = '';
  try { pw = localStorage.getItem(KEY) || ''; } catch (e) { /* private mode */ }
  var $ = function (id) { return document.getElementById(id); };
  var SCOPE = 'vpm', DATA = null, DAYS = 30, CFROM = '', CTO = '', GEN = 0, SORT = ['ctr', -1], SHOW = 50, VIEWROWS = [];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(v) { return v == null ? 'n/a' : '$' + Math.round(v).toLocaleString('en-US'); }
  function money2(v) { return v == null ? 'n/a' : '$' + (v >= 1000 ? Math.round(v).toLocaleString('en-US') : v.toFixed(2)); }
  function int(v) { return v == null ? 'n/a' : Math.round(v).toLocaleString('en-US'); }
  function pct(v, d) { return v == null ? 'n/a' : (v * 100).toFixed(d == null ? 2 : d) + '%'; }
  function dlab(iso) { return iso ? new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }) : ''; }
  function vidOk(id) { return /^[A-Za-z0-9_-]{6,20}$/.test(id || ''); }

  function api(path) { return fetch(path, { headers: { 'x-admin-key': pw } }).then(function (r) { return r.json().then(function (j) { if (r.status === 401) throw { auth: 1 }; if (!r.ok) throw new Error(j.error || 'Failed'); return j; }); }); }
  function gate(msg) { $('gate').hidden = false; $('filters').hidden = true; $('tctl').hidden = true; $('list').innerHTML = ''; $('sum').innerHTML = ''; $('leaders').innerHTML = ''; $('out').hidden = true; if (msg) { $('gerr').hidden = false; $('gerr').textContent = msg; } $('pw').focus(); }
  $('gate').addEventListener('submit', function (e) { e.preventDefault(); pw = $('pw').value.trim(); if (!pw) return; try { localStorage.setItem(KEY, pw); } catch (er) { /* ignore */ } load(); });
  $('out').addEventListener('click', function () { try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } pw = ''; gate(); });

  function controls() {
    $('scp').innerHTML = [['vpm', 'VPM campaigns'], ['all', 'All campaigns'], ['other', 'Not VPM']].map(function (o) { return '<button type="button" data-s="' + o[0] + '" class="' + (SCOPE === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('');
    $('rng').innerHTML = [[7, 'Last 7 days'], [30, 'Last 30 days'], [90, 'Last 90 days'], ['custom', 'Custom']].map(function (o) { return '<button type="button" data-d="' + o[0] + '" class="' + (String(DAYS) === String(o[0]) ? 'on' : '') + '">' + o[1] + '</button>'; }).join('');
    $('cform').hidden = DAYS !== 'custom';
  }
  $('cform').addEventListener('submit', function (e) {
    e.preventDefault(); var f = $('cfrom').value, t = $('cto').value;
    if (!f || !t || f > t) return alert('Pick a start date before the end date.');
    CFROM = f; CTO = t; load();
  });
  // Custom dates are fetched live from Google, three clients at a time, filling in as each one arrives.
  function loadCustom(j, gen) {
    var q = (j.tokens || []).slice(), total = q.length, done = 0, fails = [];
    DATA.videos = []; DATA.missing = []; DATA.range = { from: CFROM, to: CTO };
    function prog() {
      $('cprog').hidden = done >= total; $('cfill').style.width = (total ? done / total * 100 : 100) + '%';
      $('ctext').textContent = 'Loading ' + dlab(CFROM) + ' to ' + dlab(CTO) + ' from Google: ' + done + ' of ' + total + ' clients. Each takes about 10 to 30 seconds.';
    }
    prog();
    function next() {
      var c = q.shift(); if (!c) return;
      api('/api/creative?token=' + encodeURIComponent(c.token) + '&from=' + CFROM + '&to=' + CTO + '&scope=' + SCOPE)
        .then(function (r) { if (gen !== GEN) return; DATA.videos = DATA.videos.concat(r.videos || []); }, function () { fails.push(c.name); })
        .then(function () { if (gen !== GEN) return; done++; DATA.missing = fails; prog(); header(); draw(); next(); });
    }
    next(); next(); next();
  }
  function header() {
    var j = DATA;
    $('tsub').textContent = (j.range ? dlab(j.range.from) + ' to ' + dlab(j.range.to) + '. ' : '') + 'Every video running for active clients' + (SCOPE === 'vpm' ? ', in VPM campaigns (vpm in the campaign name)' : SCOPE === 'other' ? ', in campaigns without vpm in the name' : '') + '. Same video in several campaigns is added together.';
    $('foot').textContent = j.missing.length ? (DAYS === 'custom' ? 'Could not load: ' + j.missing.join(', ') + '.' : 'No saved data yet for: ' + j.missing.join(', ') + '. It fills in after the next 10 am refresh, or open that client on the All clients page and press Load now.') : '';
  }
  function load() {
    if (!pw) return gate();
    var gen = ++GEN; controls(); $('cprog').hidden = true;
    if (DAYS === 'custom' && !(CFROM && CTO)) return;
    $('list').innerHTML = '<div class="panel"><p class="msg">Loading every video</p></div>';
    api('/api/creative?days=' + (DAYS === 'custom' ? 30 : DAYS) + '&scope=' + SCOPE).then(function (j) {
      if (gen !== GEN) return;
      DATA = j; $('gate').hidden = true; $('gerr').hidden = true; $('out').hidden = false; $('filters').hidden = false; $('tctl').hidden = false;
      var cur = $('fclient').value || 'all';
      $('fclient').innerHTML = '<option value="all">All clients</option>' + j.clients.map(function (c) { return '<option' + (c === cur ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('');
      controls();
      if (DAYS === 'custom') return loadCustom(j, gen);
      header(); draw();
    }).catch(function (e) { if (e && e.auth) gate('That password did not work.'); else $('list').innerHTML = '<div class="panel"><p class="msg">' + esc(e.message) + '</p></div>'; });
  }

  var COLS = [
    ['title', 'Video', 0], ['client', 'Client', 0], ['impressions', 'Impr.', 1], ['clicks', 'Clicks', 1], ['ctr', 'CTR', 1], ['view_rate', 'View rate', 1], ['p100', 'Watched to end', 1],
    ['results', 'Conv.', 1], ['cvr', 'Conv. rate', 1], ['cpa', 'Cost per conv.', 1], ['spend', 'Spend', 1]
  ];
  function filtered() {
    var c = $('fclient').value, q = $('fq').value.trim().toLowerCase(), min = Number($('fmin').value) || 0, show = $('fshow').value;
    var under = show === 'under' ? underSet() : null;
    return DATA.videos.filter(function (v) {
      if (show === 'new' && !v.is_new) return false;
      if (show === 'running' && v.running !== true) return false;
      if (show === 'paused' && v.running !== false) return false;
      if (under && !under.has(v)) return false;
      return (c === 'all' || v.client === c) && (show === 'new' || v.impressions >= min) && (!q || (v.title + ' ' + v.campaigns.join(' ')).toLowerCase().indexOf(q) > -1);
    });
  }
  // Underfunded winner: at least 2 results, cost per result at or under the client's goal (or under that client's
  // middle video when there is no goal), and under 10% of the spend of the campaigns it runs in.
  function underSet() {
    var med = {}, by = {};
    DATA.videos.forEach(function (v) { if (v.cpa != null && v.results >= 2) (by[v.client] = by[v.client] || []).push(v.cpa); });
    Object.keys(by).forEach(function (k) { var a = by[k].sort(function (x, y) { return x - y; }); med[k] = a[Math.floor((a.length - 1) / 2)]; });
    var set = new Set();
    DATA.videos.forEach(function (v) {
      if (v.results < 2 || v.cpa == null || v.spend_share == null || v.spend_share >= 0.1) return;
      var bar = v.goal_cpa || med[v.client]; if (bar != null && v.cpa <= bar) set.add(v);
    });
    return set;
  }
  function keyOf(v) { return v.client_token + '|' + (v.video_id || v.title); }
  function since(v) {
    if (!v.first_day) return '';
    var whole = v.range_from && v.first_day <= v.range_from;
    if (v.running === false) return 'Paused, last ran ' + dshort(v.last_day);
    return 'Running' + (whole ? ', live the whole range' : ', live since ' + dshort(v.first_day) + ' (' + daysLive(v) + ' days)');
  }
  function daysLive(v) { return Math.round((new Date(v.last_day + 'T12:00:00Z') - new Date(v.first_day + 'T12:00:00Z')) / 864e5) + 1; }
  function dshort(iso) { return iso ? new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }) : ''; }
  function status(v) {
    if (v.running == null) return '';
    return '<span class="vst ' + (v.running ? 'on' : 'off') + '" title="' + esc(since(v)) + '">' + (v.is_new ? '<i class="vnew">New</i>' : '') + esc(since(v)) + '</span>';
  }
  // Top quarter green, bottom quarter red, compared with the other videos on screen.
  function bands(rows, k, low) {
    var vals = rows.map(function (r) { return r[k]; }).filter(function (x) { return x != null; }).sort(function (a, b) { return a - b; });
    if (vals.length < 4) return function () { return ''; };
    var lo = vals[Math.floor(vals.length * 0.25)], hi = vals[Math.floor(vals.length * 0.75)];
    return function (v) { if (v == null) return ''; var good = low ? v <= lo : v >= hi, bad = low ? v >= hi : v <= lo; return good ? 'good' : bad ? 'bad' : ''; };
  }
  function thumb(v) {
    var img = vidOk(v.video_id) ? 'background-image:url(https://i.ytimg.com/vi/' + v.video_id + '/mqdefault.jpg)' : '';
    return '<button type="button" class="vth" data-k="' + esc(keyOf(v)) + '" data-play="' + esc(v.video_id) + '" data-title="' + esc(v.title) + '" data-meta="' + esc(v.client + ' · ' + v.campaigns.join(', ')) + '" aria-label="Play ' + esc(v.title) + '"><span class="pic" style="' + img + '"><svg viewBox="0 0 16 16"><path d="M5 3l8 5-8 5z"/></svg>' + (v.duration ? '<em>' + esc(v.duration) + '</em>' : '') + '</span><span class="tt"><b>' + esc(v.title) + '</b><small>' + esc(v.campaigns.slice(0, 2).join(', ') + (v.campaigns.length > 2 ? ' +' + (v.campaigns.length - 2) : '')) + '</small>' + status(v) + '</span></button>';
  }
  function leaders(rows) {
    function top(k, label, f, low, min, sub) {
      var L = rows.filter(function (v) { return v[k] != null && (!min || min(v)); }).sort(function (a, b) { return low ? a[k] - b[k] : b[k] - a[k]; }).slice(0, 3);
      return '<div class="panel lead"><h3>' + label + '</h3><p class="sub">' + sub + '</p>' + (L.length ? '<ol>' + L.map(function (v) { return '<li><button type="button" data-k="' + esc(keyOf(v)) + '" data-play="' + esc(v.video_id) + '" data-title="' + esc(v.title) + '" data-meta="' + esc(v.client) + '"><b>' + f(v[k]) + '</b><span>' + esc(v.title) + '<small>' + esc(v.client) + '</small></span></button></li>'; }).join('') + '</ol>' : '<p class="msg small">Not enough data yet.</p>') + '</div>';
    }
    return top('ctr', 'Best click-through rate', function (x) { return pct(x); }, false, function (v) { return v.impressions >= 1000; }, 'At least 1,000 impressions') +
      top('cvr', 'Best conversion rate', function (x) { return pct(x, 1); }, false, function (v) { return v.clicks >= 30; }, 'At least 30 clicks') +
      top('cpa', 'Lowest cost per conversion', money2, true, function (v) { return v.results >= 2; }, 'At least 2 conversions') +
      top('p100', 'Most watched to the end', function (x) { return pct(x, 0); }, false, function (v) { return v.impressions >= 1000; }, 'Share watched to 100%, 1,000+ impressions') +
      underCard(rows);
  }
  function underCard(rows) {
    var u = underSet(), L = rows.filter(function (v) { return u.has(v); }).sort(function (a, b) { return a.cpa - b.cpa; }).slice(0, 3);
    return '<div class="panel lead under"><h3>Underfunded winners</h3><p class="sub">Good cost per conversion, under 10% of the campaign spend. Worth more budget.</p>' + (L.length ? '<ol>' + L.map(function (v) { return '<li><button type="button" data-k="' + esc(keyOf(v)) + '" data-play="' + esc(v.video_id) + '" data-title="' + esc(v.title) + '" data-meta="' + esc(v.client) + '"><b>' + money2(v.cpa) + '</b><span>' + esc(v.title) + '<small>' + esc(v.client) + ', ' + pct(v.spend_share, 0) + ' of campaign spend</small></span></button></li>'; }).join('') + '</ol>' : '<p class="msg small">None right now.</p>') + '</div>';
  }
  function draw() {
    var rows = filtered();
    var tot = rows.reduce(function (a, v) { a.s += v.spend; a.i += v.impressions; a.c += v.clicks; a.r += v.results; return a; }, { s: 0, i: 0, c: 0, r: 0 });
    $('sum').innerHTML = [['Videos', int(rows.length)], ['Impressions', int(tot.i)], ['Clicks', int(tot.c)], ['Average CTR', tot.i ? pct(tot.c / tot.i) : 'n/a'], ['Conversions', int(tot.r)], ['Spend', money(tot.s)]].map(function (x) { return '<div class="kpi"><div class="l">' + x[0] + '</div><div class="v">' + x[1] + '</div></div>'; }).join('');
    $('leaders').innerHTML = rows.length ? leaders(rows) : '';
    var k = SORT[0], d = SORT[1];
    rows.sort(function (a, b) { var x = a[k], y = b[k]; if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (typeof x === 'string' ? x.localeCompare(y) : x - y) * d; });
    VIEWROWS = rows;
    var bC = bands(rows, 'ctr'), bV = bands(rows, 'view_rate'), bE = bands(rows, 'p100'), bR = bands(rows, 'cvr'), bP = bands(rows, 'cpa', true);
    var head = '<thead><tr>' + COLS.map(function (c) { var on = SORT[0] === c[0]; return '<th class="' + (c[2] ? 'n' : '') + '"><button type="button" data-sort="' + c[0] + '">' + c[1] + (on ? (SORT[1] > 0 ? ' ▲' : ' ▼') : '') + '</button></th>'; }).join('') + '</tr></thead>';
    var body = rows.slice(0, SHOW).map(function (v) {
      return '<tr><td class="vidc">' + thumb(v) + '</td><td class="cl">' + esc(v.client) + '<br><span class="tag">' + esc(v.types.join(', ')) + '</span></td><td class="n">' + int(v.impressions) + '</td><td class="n">' + int(v.clicks) + '</td><td class="n ' + bC(v.ctr) + '">' + pct(v.ctr) + '</td><td class="n ' + bV(v.view_rate) + '">' + pct(v.view_rate, 1) + '</td><td class="n ' + bE(v.p100) + '">' + pct(v.p100, 0) + '</td><td class="n" title="' + esc(v.result_label) + '">' + int(v.results) + '</td><td class="n ' + bR(v.cvr) + '">' + pct(v.cvr, 1) + '</td><td class="n ' + bP(v.cpa) + '">' + money2(v.cpa) + '</td><td class="n">' + money(v.spend) + '</td></tr>';
    }).join('');
    $('list').innerHTML = rows.length ? '<div class="panel tpanel"><p class="sub legend2">Green is the top quarter of the videos shown, red the bottom quarter. Conv. counts each client\'s main result. Click a column to sort, click a video to play it.</p><div class="tw"><table class="t ct">' + head + '<tbody>' + body + '</tbody></table></div>' + (rows.length > SHOW ? '<div class="more"><button type="button" class="obtn" data-more="1">Show more (' + (rows.length - SHOW) + ' left)</button></div>' : '') + '</div>' : '<div class="panel"><p class="msg">No videos match. Try a lower minimum impressions or another client.</p></div>';
  }
  function csv() {
    var h = ['Client', 'Video', 'YouTube ID', 'Campaigns', 'Impressions', 'Clicks', 'CTR', 'Views', 'View rate', 'Watched 25%', 'Watched 50%', 'Watched 75%', 'Watched 100%', 'Status', 'First served', 'Last served', 'Share of campaign spend', 'Conversions (main result)', 'Conversion rate', 'Cost per conversion', 'Spend'];
    var lines = [h].concat(VIEWROWS.map(function (v) { return [v.client, v.title, v.video_id, v.campaigns.join(' | '), v.impressions, v.clicks, v.ctr, v.views, v.view_rate, v.p25, v.p50, v.p75, v.p100, v.running == null ? '' : v.running ? 'Running' : 'Paused', v.first_day, v.last_day, v.spend_share, v.results, v.cvr, v.cpa, v.spend]; }));
    var text = lines.map(function (r) { return r.map(function (x) { x = x == null ? '' : String(x); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = 'vpm-videos-' + DAYS + 'd.csv'; document.body.appendChild(a); a.click(); a.remove();
  }
  function curve(v) {
    if (!v || v.p25 == null) return '';
    var pts = [['Started', v.view_rate != null ? 1 : null], ['25%', v.p25], ['50%', v.p50], ['75%', v.p75], ['100%', v.p100]].filter(function (p) { return p[1] != null; });
    var max = Math.max.apply(null, pts.slice(1).map(function (p) { return p[1]; }).concat([0.0001]));
    var bars = pts.slice(1).map(function (p) { return '<div class="cb"><span class="cbv">' + pct(p[1], 0) + '</span><span class="cbb"><i style="height:' + Math.max(3, Math.round(p[1] / max * 100)) + '%"></i></span><span class="cbl">' + p[0] + '</span></div>'; }).join('');
    var drop = v.p25 ? 1 - v.p100 / v.p25 : null;
    return '<h3>Watch curve</h3><p class="sub">Share of impressions that watched to each point.' + (drop != null ? ' ' + pct(drop, 0) + ' of people who reached 25% dropped off before the end.' : '') + '</p><div class="cbars">' + bars + '</div>' + (v.first_day ? '<p class="sub">' + esc(since(v)) + '.</p>' : '');
  }
  function play(id, title, meta, k) {
    $('mtitle').textContent = title; $('mmeta').textContent = meta || '';
    var row = null; if (k && DATA) DATA.videos.some(function (v) { if (keyOf(v) === k) { row = v; return true; } return false; });
    $('mcurve').innerHTML = curve(row);
    if (vidOk(id)) {
      $('mvideo').innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1&origin=' + encodeURIComponent(location.origin) + '" title="' + esc(title) + '" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
      $('mlink').innerHTML = '<a class="mbtn" href="https://www.youtube.com/watch?v=' + id + '" target="_blank" rel="noopener">Watch on YouTube</a>';
    } else { $('mvideo').innerHTML = '<p class="msg">Google did not share a YouTube link for this video.</p>'; $('mlink').innerHTML = ''; }
    $('modal').hidden = false;
  }
  function close() { $('modal').hidden = true; $('mvideo').innerHTML = ''; }
  ['fclient', 'fmin', 'fshow'].forEach(function (id) { $(id).addEventListener('change', function () { SHOW = 50; draw(); }); });
  $('fq').addEventListener('input', function () { SHOW = 50; draw(); });
  $('csv').addEventListener('click', csv);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('modal').hidden) close(); });
  document.addEventListener('click', function (e) {
    if (e.target === $('modal')) return close();
    var t = e.target.closest('[data-d],[data-sort],[data-more],[data-play],[data-close],[data-s]'); if (!t) return;
    if (t.dataset.s) { SCOPE = t.dataset.s; return load(); }
    if (t.dataset.close) return close();
    if (t.dataset.d) {
      if (t.dataset.d === 'custom') {
        DAYS = 'custom';
        if (!CFROM) { var d = new Date(Date.now() - 864e5); CTO = d.toISOString().slice(0, 10); CFROM = new Date(d.getTime() - 29 * 864e5).toISOString().slice(0, 10); }
        $('cfrom').value = CFROM; $('cto').value = CTO; controls(); return;
      }
      DAYS = Number(t.dataset.d); return load();
    }
    if (t.dataset.sort) { var k = t.dataset.sort; SORT = SORT[0] === k ? [k, -SORT[1]] : [k, k === 'title' || k === 'client' || k === 'cpa' ? 1 : -1]; return draw(); }
    if (t.dataset.more) { SHOW += 50; return draw(); }
    if (t.dataset.play != null) return play(t.dataset.play, t.dataset.title, t.dataset.meta, t.dataset.k);
  });
  load();
})();
</script>

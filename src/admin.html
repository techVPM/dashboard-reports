<div class="vpm tm ad" id="vpm">
<div class="wrap">
  <header class="tbar">
    <div class="brand">VIDEO POWER<span>MARKETING</span></div>
    <div class="tbtns"><!--TABS:admin--><button type="button" class="tlink" id="out" hidden>Sign out</button></div>
  </header>
  <div class="thead"><div><h1>Clients and goals</h1><p class="sub">Add a client or change budgets, goals and notes. Changes show on the client's report within a few minutes.</p></div></div>
  <form class="panel gate" id="gate" hidden>
    <h2>Team sign in</h2>
    <p class="sub">Use the admin password (the ADMIN_PASSWORD setting in Netlify).</p>
    <div class="grow"><input type="password" id="pw" autocomplete="current-password" aria-label="Password" placeholder="Password"><button class="mbtn" type="submit">Sign in</button></div>
    <p class="err" id="gerr" hidden></p>
  </form>
  <p class="srcnote" id="src" hidden></p>
  <div class="adgrid" id="app" hidden>
    <aside class="panel clientlist">
      <button type="button" class="mbtn full" data-new="1">+ Add a client</button>
      <ul id="clist"></ul>
    </aside>
    <form class="panel cform" id="form" novalidate></form>
  </div>
</div>
<div class="modal" id="ask" hidden role="dialog" aria-modal="true" aria-labelledby="asktitle">
  <div class="mbox small">
    <h2 id="asktitle">Save your changes?</h2>
    <p id="asktext" class="sub"></p>
    <div class="fbtns"><button type="button" class="mbtn" data-ask="save">Save and continue</button><button type="button" class="obtn" data-ask="discard">Discard changes</button><button type="button" class="obtn" data-ask="stay">Keep editing</button></div>
  </div>
</div>
</div>
<script>
(function () {
  'use strict';
  var KEY = 'vpm_admin_key', pw = '';
  try { pw = localStorage.getItem(KEY) || ''; } catch (e) { /* private mode */ }
  var $ = function (id) { return document.getElementById(id); };
  var LIST = [], CUR = null, ORIG = null, SITE = location.origin, DIRTY = false, PENDING = null;
  var TZ = [['America/New_York', 'Eastern'], ['America/Chicago', 'Central'], ['America/Denver', 'Mountain'], ['America/Phoenix', 'Arizona'], ['America/Los_Angeles', 'Pacific'], ['America/Anchorage', 'Alaska'], ['Pacific/Honolulu', 'Hawaii']];
  var TYPES = [['video', 'Video (YouTube and Demand Gen)'], ['search', 'Search'], ['pmax', 'Performance Max'], ['search+pmax', 'Search and Performance Max'], ['shopping', 'Shopping'], ['display', 'Display']];
  var TYPE_SHORT = { video: 'Video', search: 'Search', pmax: 'PMax', 'search+pmax': 'Search and PMax', shopping: 'Shopping', display: 'Display' };
  var FORM_KEYS = ['name', 'customer_id', 'token', 'timezone', 'default_scope', 'disabled', 'include_paused', 'goals', 'notes', 'last_change_date', 'ads_url', 'ghl_contact_id', 'meta_ad_account', 'drive_url', 'internal_notes'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function slug(n, id) { return String(n || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') + '-' + String(id || '').replace(/\D/g, '').slice(-4); }
  function money(v) { return '$' + Math.round(Number(v)).toLocaleString('en-US'); }

  function api(path, opt) {
    opt = opt || {}; opt.headers = Object.assign({ 'x-admin-key': pw, 'content-type': 'application/json' }, opt.headers || {});
    return fetch(path, opt).then(function (r) { return r.json().then(function (j) { if (r.status === 401) throw { auth: 1 }; if (!r.ok) throw new Error(j.error || 'Failed'); return j; }); });
  }
  function gate(msg) { $('gate').hidden = false; $('app').hidden = true; $('src').hidden = true; $('out').hidden = true; if (msg) { $('gerr').hidden = false; $('gerr').textContent = msg; } $('pw').focus(); }
  $('gate').addEventListener('submit', function (e) { e.preventDefault(); pw = $('pw').value.trim(); if (!pw) return; try { localStorage.setItem(KEY, pw); } catch (er) { /* ignore */ } load(); });
  $('out').addEventListener('click', function () { guard(function () { try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } pw = ''; gate(); }); });
  window.addEventListener('beforeunload', function (e) { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

  function load(pick) {
    if (!pw) return gate();
    api('/api/admin').then(function (j) {
      LIST = j.clients || []; $('gate').hidden = true; $('gerr').hidden = true; $('app').hidden = false; $('out').hidden = false;
      var s = $('src'); s.hidden = j.source === 'admin';
      s.textContent = 'Right now the client list comes from ' + j.source + ' in GitHub. The first time you save here, this page takes over and clients.json is no longer used.';
      var want = pick || (location.hash || '').slice(1);
      var c = LIST.filter(function (x) { return x.token === want; })[0] || LIST.filter(function (x) { return !x.disabled; })[0] || LIST[0];
      edit(c || null);
    }).catch(function (e) { if (e && e.auth) gate('That password did not work.'); else alert(e.message); });
  }

  /* ---------- goal summary, used in the list and at the top of the form ---------- */
  function summary(c) {
    var g = (c && c.goals) || {}, out = [], lbl = g.result_label || 'result';
    var one = String(lbl).toLowerCase().replace(/s$/, '');
    if (g.cost_per_conversion) out.push((/\d\s*(-|to)\s*\$?\d/.test(String(g.cost_per_conversion)) ? '$' + String(g.cost_per_conversion).replace(/\s*(-|to)\s*/, ' to $').replace(/\$\$/g, '$') : money(String(g.cost_per_conversion).replace(/[$,]/g, ''))) + ' per ' + one);
    var sp = [];
    if (g.monthly_spend) sp.push(money(g.monthly_spend) + ' total');
    Object.keys(g.spend_by_type || {}).forEach(function (k) { sp.push(money(g.spend_by_type[k]) + ' ' + (TYPE_SHORT[k] || k)); });
    if (sp.length) out.push(sp.join(' + ') + ' a month');
    if (g.weekly_conversions) out.push(g.weekly_conversions + ' ' + lbl.toLowerCase() + ' a week');
    if (g.monthly_conversions) out.push(g.monthly_conversions + ' ' + lbl.toLowerCase() + ' a month');
    if (g.roas) out.push(g.roas + 'x return');
    if (c && c.default_scope === 'vpm') out.push('VPM campaigns only');
    return out;
  }
  function drawList() {
    function item(c) { var s = summary(c); return '<li><button type="button" data-pick="' + esc(c.token) + '" class="' + (ORIG && ORIG === c.token ? 'on' : '') + '">' + esc(c.name) + '<small>' + esc(s.length ? s.slice(0, 2).join(' · ') : 'No goals yet') + '</small></button></li>'; }
    var srt = LIST.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    var act = srt.filter(function (c) { return !c.disabled; }), ina = srt.filter(function (c) { return c.disabled; });
    $('clist').innerHTML = '<li><h3>Active (' + act.length + ')</h3></li>' + act.map(item).join('') +
      (ina.length ? '<li><details' + (CUR && CUR.disabled && ORIG ? ' open' : '') + '><summary>Inactive (' + ina.length + ')</summary><ul class="inact">' + ina.map(item).join('') + '</ul></details></li>' : '');
  }

  /* ---------- form pieces ---------- */
  function f(label, id, v, hint, type, ph) { return '<label class="fld"><span>' + label + '</span><input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(v == null ? '' : v) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '>' + (hint ? '<small>' + hint + '</small>' : '') + '</label>'; }
  function ta(label, id, v, hint, rows, ph) { return '<label class="fld wide"><span>' + label + '</span><textarea id="' + id + '" rows="' + (rows || 3) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '>' + esc(v || '') + '</textarea>' + (hint ? '<small>' + hint + '</small>' : '') + '</label>'; }
  function splitRow(type, amt) {
    return '<div class="srow"><select class="s_type" aria-label="Campaign type">' + TYPES.map(function (t) { return '<option value="' + t[0] + '"' + (t[0] === type ? ' selected' : '') + '>' + t[1] + '</option>'; }).join('') + '</select><span class="dollar"><input class="s_amt" inputmode="decimal" aria-label="Dollars a month" placeholder="Dollars a month" value="' + esc(amt == null ? '' : amt) + '"></span><button type="button" class="xbtn" data-rmsplit="1" aria-label="Remove this split">&times;</button></div>';
  }
  function section(title, sub, body, open, collapsible) {
    if (!collapsible) return '<section class="fsec"><div class="fsh"><h3>' + title + '</h3>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' + body + '</section>';
    return '<details class="fsec fold2"' + (open ? ' open' : '') + '><summary><h3>' + title + '</h3>' + (sub ? '<p>' + sub + '</p>' : '') + '</summary>' + body + '</details>';
  }

  function edit(c) {
    CUR = c ? JSON.parse(JSON.stringify(c)) : { name: '', customer_id: '', timezone: 'America/Denver', goals: {} };
    ORIG = c ? c.token : null; DIRTY = false;
    try { history.replaceState(null, '', ORIG ? '#' + ORIG : location.pathname); } catch (e) { /* ignore */ }
    drawList();
    var g = CUR.goals || {}, sbt = g.spend_by_type || {}, note = (CUR.notes && CUR.notes[0] && CUR.notes[0].body) || '';
    var adv = {}; Object.keys(CUR).forEach(function (k) { if (FORM_KEYS.indexOf(k) < 0) adv[k] = CUR[k]; });
    var link = ORIG ? SITE + '/' + ORIG : '', sm = summary(CUR);
    var volN = g.weekly_conversions || g.monthly_conversions || '', volP = g.weekly_conversions ? 'week' : 'month';
    var moreOpen = !!(g.roas || g.note);

    $('form').innerHTML =
      '<div class="fhead"><div><h2>' + (ORIG ? esc(CUR.name) : 'New client') + '</h2>' + (sm.length ? '<p class="glance">' + sm.map(esc).join(' · ') + '</p>' : '') + '</div>' +
        '<div class="fhbtns">' + (link && !CUR.disabled ? '<a class="obtn" href="' + esc(link) + '" target="_blank" rel="noopener">Open report</a>' : '') + '<label class="activetog"><input type="checkbox" id="f_active"' + (CUR.disabled ? '' : ' checked') + '><span>Active client</span></label></div></div>' +
      (link ? '<p class="linkline">Client link: <b>' + esc(link) + '</b> <button type="button" class="tlink" data-copy="' + esc(link) + '">Copy link</button> <button type="button" class="tlink" data-copy="' + esc(embedCode(link, CUR.name)) + '" title="Paste into a Custom HTML or Code element on the client\'s GoHighLevel portal page">Copy embed code</button>' + (ORIG ? ' <a class="tlink" href="/profile?c=' + encodeURIComponent(ORIG) + '">Client profile</a>' : '') + (CUR.disabled ? ' <span class="pill early">Turned off while inactive</span>' : '') + '</p>' : '') +

      (ORIG ? '' : '<div class="tpls"><b>Start from a template</b><div class="tplbtns">' + TEMPLATES.map(function (t, i) { return '<button type="button" class="tpl" data-tpl="' + i + '"><b>' + t.name + '</b><small>' + t.sub + '</small></button>'; }).join('') + '</div></div>') +
      section('Client', '', '<div class="fgrid g3">' +
        f('Client name', 'f_name', CUR.name) +
        f('Google Ads ID', 'f_cid', CUR.customer_id, '', 'text', '123-456-7890') +
        '<label class="fld"><span>Ads account time zone</span><select id="f_tz">' + TZ.map(function (z) { return '<option value="' + z[0] + '"' + ((CUR.timezone || 'America/Denver') === z[0] ? ' selected' : '') + '>' + z[1] + '</option>'; }).join('') + '</select></label>' +
        '<label class="fld wide"><span>Campaigns we manage</span><select id="f_scope"><option value="all"' + (CUR.default_scope === 'vpm' ? '' : ' selected') + '>All campaigns in the account</option><option value="vpm"' + (CUR.default_scope === 'vpm' ? ' selected' : '') + '>Only campaigns with VPM in the name</option></select><small>Sets what the client report, goals and team dashboard show first. Anyone can still switch between VPM, not VPM and all campaigns.</small></label>' +
      '</div>') +

      section('GoHighLevel and links', 'Link the client to their GoHighLevel contact, and keep their other accounts in one place.', '<div class="fgrid g3">' +
        '<div class="fld wide"><span>GoHighLevel contact</span><div class="ghlrow"><select id="f_ghl" aria-label="GoHighLevel contact"><option value="' + esc(CUR.ghl_contact_id || '') + '">Loading GoHighLevel contacts</option></select><button type="button" class="obtn" data-ghlfill="1" id="ghlfill" hidden>Fill name and Google Ads ID</button></div><small id="ghlinfo">Links billing, start date and fee to this client for the Business page, health score and client profile.</small></div>' +
        f('Meta ad account ID', 'f_meta', CUR.meta_ad_account, 'From Meta Ads Manager, like act_1234567890. Meta conversions can be picked once Meta is connected.', 'text', 'act_1234567890') +
        f('Google Drive folder', 'f_drive', CUR.drive_url, 'Link to the client\'s shared folder', 'url', 'https://drive.google.com/...') +
        ta('Internal notes', 'x_inotes', CUR.internal_notes, 'Only the team sees these, on the client profile page. Never shown to the client.', 3, 'For example: prefers calls on Tuesdays, renewal talk in March') +
      '</div>') +

      section('Goal', 'What a good result looks like for this client.', '<div class="fgrid g3">' +
        f('Target cost per result', 'g_cpa', g.cost_per_conversion, 'A number like 250, or a range like 200-300') +
        f('What to call a result', 'g_lbl', g.result_label, 'For example Leads, Booked calls, Store visits') +
        '<label class="fld"><span>Results goal</span><span class="pair"><input id="g_vol" inputmode="numeric" value="' + esc(volN) + '" aria-label="Number of results"><select id="g_volp" aria-label="Per"><option value="week"' + (volP === 'week' ? ' selected' : '') + '>a week</option><option value="month"' + (volP === 'month' ? ' selected' : '') + '>a month</option></select></span><small>Optional</small></label>' +
        '<div class="fld wide"><span>Conversions</span><div class="cpick" id="cpick"><p class="sub">Loading the conversion actions from this Google Ads account.</p></div>' +
          '<details class="typed" id="typed"><summary>Type names instead</summary><div class="fgrid">' +
            ta('Main conversions, one per line', 'g_focus', (g.focus_conversions || []).join('\n'), 'Counted as results.', 2) +
            ta('Other conversions to watch, one per line', 'g_sec', (g.secondary_conversions || []).join('\n'), 'Shown on the team dashboard, not counted as results.', 2) +
          '</div></details></div>' +
      '</div>') +

      section('Budget', 'Monthly spend. Add a split if budgets are set per campaign type.', '<div class="fgrid g3">' +
        f('Whole account, per month', 'g_ms', g.monthly_spend, 'Optional') +
      '</div><div class="splits" id="splits">' + Object.keys(sbt).map(function (k) { return splitRow(k, sbt[k]); }).join('') + '</div><button type="button" class="tlink addsplit" data-addsplit="1">+ Add a split by campaign type</button>') +

      section('More goal options', 'Return on ad spend and a goal note for the client', '<div class="fgrid">' +
        f('Target return on ad spend', 'g_roas', g.roas, 'For example 4 means $4 back for every $1. Needs revenue tracking.') +
        ta('Goal note shown to the client', 'g_note', g.note, 'One sentence, for example: Goal is under $250 per booked demo.', 2) +
      '</div>', moreOpen, true) +

      section('Client report extras', 'A note from your team, and the 14-day wait clock', '<div class="fgrid">' +
        ta('Note to the client', 'x_note', note, 'Shows at the top of their Insights page.', 3) +
        f('Date of the last big account change', 'x_lcd', CUR.last_change_date, 'Starts the 14-day wait clock', 'date') +
      '</div>', !!(note || CUR.last_change_date), true) +

      section('Account settings', 'Link key, paused campaigns, Google Ads link', '<div class="fgrid">' +
        f('Link key', 'f_tok', CUR.token, 'Leave blank to use the name plus the last 4 digits of the Ads ID. Changing it breaks the old link.') +
        f('Google Ads link', 'x_ads', CUR.ads_url, 'Only if the team dashboard button opens the wrong account') +
        '<label class="chkl"><input type="checkbox" id="f_paused"' + (CUR.include_paused ? ' checked' : '') + '> Show paused campaigns in the report</label>' +
      '</div>', !ORIG, true) +

      section('Advanced (for developers)', 'Other settings as JSON', ta('Other settings', 'x_adv', JSON.stringify(adv, null, 2), 'outcomes, labels, targets, term_groups, actions, conversion_field and so on. Leave as is if unsure.', 8), false, true) +

      '<div class="savebar"><span class="dirty" id="dirty" hidden>Unsaved changes</span><p class="err" id="ferr" hidden></p><p class="ok" id="fok" hidden></p><span class="sp"></span>' +
        (ORIG ? '<button type="button" class="obtn danger" data-del="1">Delete</button>' : '') + '<button type="submit" class="mbtn">' + (ORIG ? 'Save changes' : 'Add client') + '</button></div>';
    loadConversions();
    loadGhl();
  }
  function embedCode(link, name) { return '<iframe src="' + link + '" title="' + String(name || 'Ad report').replace(/"/g, '') + ' ad report" style="width:100%;min-height:2400px;border:0" loading="lazy"></iframe>'; }
  /* ---------- GoHighLevel contact picker ---------- */
  var GHL = { list: null, err: '', busy: false };
  function fmtAds(d) { d = String(d || '').replace(/\D/g, ''); return d.length === 10 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : d; }
  function dshort(s) { return s ? new Date(s + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }) : ''; }
  function loadGhl() {
    if (GHL.list || GHL.err) return drawGhl();
    if (GHL.busy) return; GHL.busy = true;
    api('/api/admin?ghl=1').then(function (j) { GHL.list = j.contacts || []; GHL.location = j.location || ''; }, function (e) { GHL.err = (e && e.message) || 'Could not load GoHighLevel.'; })
      .then(function () { GHL.busy = false; drawGhl(); });
  }
  function ghlById(id) { return (GHL.list || []).filter(function (x) { return x.id === id; })[0] || null; }
  function drawGhl() {
    var el = $('f_ghl'); if (!el) return;
    var cur = CUR.ghl_contact_id || '';
    if (GHL.err) { el.innerHTML = '<option value="' + esc(cur) + '">' + (cur ? 'Linked (' + esc(cur) + ')' : 'GoHighLevel not available') + '</option>'; el.disabled = !cur; $('ghlinfo').textContent = GHL.err; return; }
    if (!GHL.list) return;
    var taken = {}; LIST.forEach(function (c) { if (c.ghl_contact_id && c.token !== ORIG) taken[c.ghl_contact_id] = c.name; });
    var opt = function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === cur ? ' selected' : '') + (taken[x.id] ? ' disabled' : '') + '>' + esc(x.name) + (x.contact && x.contact !== x.name ? ' (' + esc(x.contact) + ')' : '') + (x.ads ? ' · ' + fmtAds(x.ads) : '') + (taken[x.id] ? ' · linked to ' + esc(taken[x.id]) : '') + '</option>'; };
    var act = GHL.list.filter(function (x) { return x.active; }), old = GHL.list.filter(function (x) { return !x.active; });
    el.disabled = false;
    el.innerHTML = '<option value="">Not linked</option>' + (act.length ? '<optgroup label="Active clients">' + act.map(opt).join('') + '</optgroup>' : '') + (old.length ? '<optgroup label="Former clients">' + old.map(opt).join('') + '</optgroup>' : '') +
      (cur && !ghlById(cur) ? '<option value="' + esc(cur) + '" selected>Linked contact not found (' + esc(cur) + ')</option>' : '');
    ghlInfo();
  }
  function ghlInfo() {
    var id = val('f_ghl'), x = ghlById(id), info = $('ghlinfo'), fill = $('ghlfill');
    if (!info) return;
    fill.hidden = !x;
    if (!x) {
      var cid = (val('f_cid') || '').replace(/\D/g, ''), guess = cid.length === 10 ? (GHL.list || []).filter(function (g) { return g.ads === cid; })[0] : null;
      info.innerHTML = guess ? 'Looks like <b>' + esc(guess.name) + '</b> in GoHighLevel (same Google Ads ID). <button type="button" class="tlink" data-ghlpick="' + esc(guess.id) + '">Link it</button>' : 'Links billing, start date and fee to this client for the Business page, health score and client profile.';
      return;
    }
    info.innerHTML = [x.active ? 'Active client' : 'Former client', x.start ? 'started ' + dshort(x.start) + (x.start_est ? ' (from first invoice)' : '') : '', x.retainer ? money(x.retainer) + ' a month' : '', x.ads ? 'Google Ads ' + fmtAds(x.ads) : 'no Google Ads ID in GoHighLevel'].filter(Boolean).map(esc).join(' · ') +
      ' · <a href="https://app.gohighlevel.com/v2/location/' + encodeURIComponent(GHL.location || 'StKSixAuNDCkNJ4snXLn') + '/contacts/detail/' + encodeURIComponent(x.id) + '" target="_blank" rel="noopener">Open in GoHighLevel</a>';
  }
  function ghlFill(force) {
    var x = ghlById(val('f_ghl')); if (!x) return;
    if (force || !val('f_name')) $('f_name').value = x.name;
    if (x.ads && (force || !val('f_cid'))) { $('f_cid').value = fmtAds(x.ads); loadConversions(); }
    setDirty(true);
  }
  /* ---------- conversion picker ---------- */
  function norm(n) { return String(n || '').toLowerCase().replace(/[\u2010-\u2015\u2212]/g, '-').replace(/\s+/g, ' ').trim(); }
  var CONV = { cid: '', list: null, err: '' };
  function pickRows() {
    var main = lines('g_focus'), watch = lines('g_sec'), mainN = main.map(norm), watchN = watch.map(norm);
    var known = (CONV.list || []).map(function (c) { return norm(c.name); });
    var extra = main.concat(watch).filter(function (n) { return known.indexOf(norm(n)) < 0; });
    var rows = (CONV.list || []).map(function (c) {
      var k = norm(c.name), st = mainN.indexOf(k) > -1 ? 'main' : watchN.indexOf(k) > -1 ? 'watch' : '';
      return '<div class="crw' + (st ? ' ' + st : '') + '"><div class="cn"><b>' + esc(c.name) + '</b><small>' + (c.count30 ? c.count30.toLocaleString('en-US') + ' in the last 30 days' : 'None in the last 30 days') + (c.category ? ' · ' + esc(c.category) : '') + (c.primary ? ' · primary in Google' : '') + '</small></div>' +
        '<div class="seg cseg"><button type="button" data-cv="main" data-cn="' + esc(c.name) + '" class="' + (st === 'main' ? 'on' : '') + '">Main result</button><button type="button" data-cv="watch" data-cn="' + esc(c.name) + '" class="' + (st === 'watch' ? 'on' : '') + '">Watch</button><button type="button" data-cv="" data-cn="' + esc(c.name) + '" class="' + (!st ? 'on' : '') + '">Ignore</button></div></div>';
    }).join('');
    var miss = extra.length ? '<p class="warnline">Not found in this account: ' + extra.map(esc).join(', ') + '. Check the spelling under "Type names instead".</p>' : '';
    return rows + miss;
  }
  function drawPicker() {
    var el = $('cpick'); if (!el) return;
    if (CONV.err) { el.innerHTML = '<p class="sub">' + esc(CONV.err) + ' You can still type the names below.</p>'; $('typed').open = true; return; }
    if (!CONV.list) { el.innerHTML = '<p class="sub">Add the Google Ads ID above to see this account\'s conversion actions.</p>'; return; }
    // Once conversions are picked, the list folds away into one summary line. Click it to change.
    var main = lines('g_focus'), watch = lines('g_sec');
    if (CONV.open == null) CONV.open = !main.length;
    var sum = main.length ? '<b>Main result:</b> ' + main.map(esc).join(', ') + (watch.length ? ' <span class="dot">·</span> <b>Watching:</b> ' + watch.map(esc).join(', ') : '') : '<b>No main conversion picked yet</b>';
    el.innerHTML = '<details class="cdrop" id="cdrop"' + (CONV.open ? ' open' : '') + '><summary><span class="csum">' + sum + '</span><span class="cchg"><span class="o">Change</span><span class="c">Done</span></span></summary>' +
      '<p class="sub">Pick which conversions count as results for this client. "Watch" shows them on the team dashboard without counting them.</p><div class="crows">' + pickRows() + '</div></details>';
    $('cdrop').addEventListener('toggle', function () { CONV.open = $('cdrop').open; });
  }
  function loadConversions() {
    var id = (val('f_cid') || '').replace(/\D/g, '');
    if (id.length !== 10) { CONV = { cid: '', list: null, err: '' }; return drawPicker(); }
    if (CONV.cid === id && (CONV.list || CONV.err)) { CONV.open = null; return drawPicker(); }
    CONV = { cid: id, list: null, err: '', open: null };
    $('cpick').innerHTML = '<p class="sub">Loading the conversion actions from this Google Ads account.</p>';
    api('/api/admin?conversions=' + id).then(function (j) { if (CONV.cid !== id) return; CONV.list = j.conversions || []; drawPicker(); })
      .catch(function (e) { if (CONV.cid !== id) return; CONV.err = e.message || 'Could not load conversions.'; drawPicker(); });
  }
  function setConv(name, to) {
    var k = norm(name);
    var main = lines('g_focus').filter(function (n) { return norm(n) !== k; }), watch = lines('g_sec').filter(function (n) { return norm(n) !== k; });
    if (to === 'main') main.push(name); else if (to === 'watch') watch.push(name);
    $('g_focus').value = main.join('\n'); $('g_sec').value = watch.join('\n');
    setDirty(true); drawPicker();
  }
  var TEMPLATES = [
    { name: 'YouTube only', sub: 'We run their YouTube and Demand Gen. Shows VPM campaigns only.', apply: function () { $('f_scope').value = 'vpm'; if (!val('g_lbl')) $('g_lbl').value = 'Leads'; if (!document.querySelector('#splits .srow')) $('splits').insertAdjacentHTML('beforeend', splitRow('video', '')); return document.querySelector('#splits .s_amt'); } },
    { name: 'Full account', sub: 'We manage every campaign. One monthly budget.', apply: function () { $('f_scope').value = 'all'; if (!val('g_lbl')) $('g_lbl').value = 'Leads'; return $('g_ms'); } },
    { name: 'Lead gen', sub: 'Judged on cost per lead and leads per month.', apply: function () { $('f_scope').value = 'all'; $('g_lbl').value = 'Leads'; $('g_volp').value = 'month'; return $('g_cpa'); } }
  ];
  function setDirty(v) { DIRTY = v; var d = $('dirty'); if (d) d.hidden = !v; if (v) { var ok = $('fok'); if (ok) ok.hidden = true; } }
  $('form').addEventListener('input', function () { setDirty(true); });
  $('form').addEventListener('change', function (e) { setDirty(true); if (e.target.id === 'f_cid') { loadConversions(); ghlInfo(); } if (e.target.id === 'f_ghl') { ghlFill(false); ghlInfo(); } if (e.target.id === 'g_focus' || e.target.id === 'g_sec') drawPicker(); });

  function val(id) { var el = $(id); return el ? el.value.trim() : ''; }
  function numv(id) { var v = val(id).replace(/[$,]/g, ''); return v === '' ? undefined : Number(v); }
  function lines(id) { return val(id).split('\n').map(function (x) { return x.trim(); }).filter(Boolean); }
  function collect() {
    var adv = {}, a = val('x_adv');
    if (a) { try { adv = JSON.parse(a); } catch (e) { throw new Error('Advanced settings are not valid JSON.'); } }
    var c = Object.assign({}, adv);
    c.name = val('f_name'); c.customer_id = val('f_cid'); c.token = val('f_tok') || slug(c.name, c.customer_id);
    c.timezone = val('f_tz');
    if (val('f_scope') === 'vpm') c.default_scope = 'vpm';
    if ($('f_paused').checked) c.include_paused = true;
    if (!$('f_active').checked) c.disabled = true;
    var g = {}, cpa = val('g_cpa');
    if (cpa) g.cost_per_conversion = /\d\s*(-|to)\s*\$?\d/.test(cpa) ? cpa : Number(cpa.replace(/[$,]/g, ''));
    if (val('g_lbl')) g.result_label = val('g_lbl');
    if (lines('g_focus').length) g.focus_conversions = lines('g_focus');
    if (lines('g_sec').length) g.secondary_conversions = lines('g_sec');
    if (numv('g_ms')) g.monthly_spend = numv('g_ms');
    var sbt = {};
    Array.prototype.forEach.call(document.querySelectorAll('#splits .srow'), function (r) { var t = r.querySelector('.s_type').value, v = Number(String(r.querySelector('.s_amt').value).replace(/[$,]/g, '')); if (v > 0) sbt[t] = (sbt[t] || 0) + v; });
    if (Object.keys(sbt).length) g.spend_by_type = sbt;
    if (numv('g_vol')) { if (val('g_volp') === 'week') g.weekly_conversions = numv('g_vol'); else g.monthly_conversions = numv('g_vol'); }
    if (numv('g_roas')) g.roas = numv('g_roas');
    if (val('g_note')) g.note = val('g_note');
    if (Object.keys(g).length) c.goals = g;
    if (val('x_note')) c.notes = [{ title: 'A note from your VPM team', body: val('x_note') }];
    if (val('x_lcd')) c.last_change_date = val('x_lcd');
    if (val('x_ads')) c.ads_url = val('x_ads');
    if (val('f_ghl')) c.ghl_contact_id = val('f_ghl');
    if (val('f_meta')) c.meta_ad_account = val('f_meta');
    if (val('f_drive')) c.drive_url = val('f_drive');
    if (val('x_inotes')) c.internal_notes = val('x_inotes');
    return c;
  }
  function msg(id, text) { ['ferr', 'fok'].forEach(function (x) { $(x).hidden = true; }); if (text) { $(id).hidden = false; $(id).textContent = text; } }
  function save() {
    var c; try { c = collect(); } catch (er) { msg('ferr', er.message); return Promise.reject(er); }
    var b = $('form').querySelector('[type=submit]'); b.disabled = true;
    return api('/api/admin', { method: 'POST', body: JSON.stringify({ action: 'save', client: c, original_token: ORIG }) })
      .then(function (j) { LIST = j.clients; $('src').hidden = true; edit(j.client); msg('fok', 'Saved. ' + (j.warmed ? 'The report is refreshing and will be ready in a minute or two.' : 'The report updates the next time it loads.')); })
      .catch(function (er) { b.disabled = false; if (er && er.auth) gate('Your password no longer works.'); else msg('ferr', er.message); throw er; });
  }
  $('form').addEventListener('submit', function (e) { e.preventDefault(); save().catch(function () { /* shown */ }); });

  /* ---------- leaving with unsaved changes ---------- */
  function guard(next) {
    if (!DIRTY) return next();
    PENDING = next;
    $('asktext').textContent = 'You changed ' + (CUR && CUR.name ? CUR.name : 'this client') + ' but have not saved yet.';
    $('ask').hidden = false; $('ask').querySelector('[data-ask=save]').focus();
  }
  function answer(a) {
    $('ask').hidden = true; var next = PENDING; PENDING = null;
    if (a === 'stay' || !next) return;
    if (a === 'discard') { DIRTY = false; return next(); }
    save().then(function () { next(); }, function () { /* stay, error is shown */ });
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('ask').hidden) answer('stay'); });

  document.addEventListener('click', function (e) {
    var a = e.target.closest('a.tlink, a.itab'); if (a && DIRTY && a.getAttribute('href')) { e.preventDefault(); return guard(function () { DIRTY = false; location.href = a.getAttribute('href'); }); }
    var t = e.target.closest('[data-pick],[data-new],[data-del],[data-copy],[data-addsplit],[data-rmsplit],[data-ask],[data-cv],[data-tpl],[data-ghlfill],[data-ghlpick]'); if (!t) return;
    if (t.dataset.ghlfill) return ghlFill(true);
    if (t.dataset.ghlpick) { $('f_ghl').value = t.dataset.ghlpick; setDirty(true); return ghlInfo(); }
    if (t.dataset.cn != null && t.dataset.cv != null) return setConv(t.dataset.cn, t.dataset.cv);
    if (t.dataset.tpl != null) {
      var tp = TEMPLATES[+t.dataset.tpl], next = tp.apply();
      document.querySelectorAll('.tpl').forEach(function (b) { b.classList.toggle('on', b === t); });
      setDirty(true);
      var nm = $('f_name'); (nm && !nm.value ? nm : next || nm).focus();
      return;
    }
    if (t.dataset.ask) return answer(t.dataset.ask);
    if (t.dataset.pick) { if (t.dataset.pick === ORIG) return; return guard(function () { edit(LIST.filter(function (x) { return x.token === t.dataset.pick; })[0]); }); }
    if (t.dataset.new) return guard(function () { edit(null); $('f_name').focus(); });
    if (t.dataset.addsplit) { $('splits').insertAdjacentHTML('beforeend', splitRow('video', '')); $('splits').lastElementChild.querySelector('.s_amt').focus(); return setDirty(true); }
    if (t.dataset.rmsplit) { t.closest('.srow').remove(); return setDirty(true); }
    if (t.dataset.copy) {
      var label = t.textContent, done = function (ok) { t.textContent = ok ? 'Copied' : 'Copy failed, select and copy by hand'; setTimeout(function () { t.textContent = label; }, 1800); };
      try { navigator.clipboard.writeText(t.dataset.copy).then(function () { done(true); }, function () { done(false); }); } catch (er) { done(false); }
      return;
    }
    if (t.dataset.del) {
      if (!confirm('Delete ' + CUR.name + '? Their link stops working and their goals are lost. To keep them, untick Active client instead.')) return;
      api('/api/admin', { method: 'POST', body: JSON.stringify({ action: 'delete', token: ORIG }) }).then(function (j) { LIST = j.clients; DIRTY = false; edit(LIST.filter(function (x) { return !x.disabled; })[0] || LIST[0] || null); }).catch(function (er) { msg('ferr', er.message); });
    }
  });
  load();
})();
</script>

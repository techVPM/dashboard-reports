[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  # Clean client links: /coach-by-chris-1613 opens the report. Real files (index.html, ghl-embed.html) still win.
  from = "/:slug"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
